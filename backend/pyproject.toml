[project]
name = "dealflow-backend"
version = "0.1.0"
description = "Dealflow: a FastAPI sales CRM (contacts, companies, deal pipeline, activities, roles)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "anthropic>=2.9.0",
    "mcp>=2.3",
    "sentry-sdk>=2.40",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Celery ships no type information
module = ["celery", "celery.*"]
ignore_missing_imports = true
